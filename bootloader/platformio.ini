; The Neon bootloader for the Heltec V3 (ESP32-S3): ESP-IDF's own, with secure boot v2. On its first
; start it burns the digest of the key that signed it into the chip and turns secure boot on: from
; then on the chip starts only firmware signed with the same key (the project's, on hq). Only the
; bootloader of this project is used; the app is MeshCore's (../build.sh).
[env:bootloader]
platform = espressif32@6.11.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_upload.flash_size = 8MB
