; Neon's build of MeshCore's companion radio (USB) for the Heltec V3: copied next to MeshCore's own
; platformio.ini by build.sh (MeshCore reads platformio.local.ini).

[env:neon_heltec_v3]
extends = env:Heltec_v3_companion_radio_usb
build_flags =
  ${env:Heltec_v3_companion_radio_usb.build_flags}
  -D NEON_RADIO=1
  -fstack-protector-strong
; The node's MeshCore identity key stays on the radio (no import or export over USB).
build_unflags =
  -fstack-protector
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
build_src_filter =
  ${env:Heltec_v3_companion_radio_usb.build_src_filter}
  +<helpers/neon/*.cpp>
